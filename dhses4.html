<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完蛋！我被四班同学包围了</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", "PingFang SC", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe4ec 0%, #fff0f6 50%, #f3e8ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 游戏主容器 */
        #game-container {
            width: 900px;
            min-height: 680px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(244, 114, 182, 0.2);
            overflow: hidden;
            border: 3px solid #f9a8d4;
            position: relative;
        }

        /* 开始界面 */
        #start-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #fce7f3 0%, #fbcfe8 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100;
        }

        #start-screen h1 {
            font-size: 48px;
            color: #be185d;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        #start-screen p {
            color: #9d174d;
            font-size: 18px;
            margin-bottom: 60px;
        }

        #start-btn {
            padding: 16px 60px;
            font-size: 22px;
            background: linear-gradient(135deg, #f472b6, #ec4899);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
            transition: transform 0.2s;
        }

        #start-btn:hover { transform: scale(1.05); }

        #romance-btn {
            margin-top: 18px;
            padding: 10px 24px;
            border: 1px solid #ec4899;
            border-radius: 24px;
            background: white;
            color: #9d174d;
            cursor: pointer;
            font-size: 16px;
        }

        #scene-area.couple-photo {
            height: 480px;
        }

        #scene-area.video-scene {
            height: auto;
            min-height: 380px;
            padding: 58px 20px 16px;
            background: #18181b !important;
        }

        #sports-video {
            display: block;
            width: 100%;
            max-height: 480px;
            background: #000;
            border-radius: 12px;
        }

        #sports-video-link {
            display: inline-block;
            margin-top: 10px;
            color: #fbcfe8;
            font-size: 14px;
        }

        /* 顶部好感度栏 */
        #favor-bar {
            height: 60px;
            background: rgba(255, 255, 255, 0.85);
            border-bottom: 2px solid #fbcfe8;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
        }

        .favor-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .favor-name {
            font-size: 14px;
            color: #831843;
            width: 60px;
        }

        .favor-track {
            width: 120px;
            height: 12px;
            background: #fce7f3;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #f9a8d4;
        }

        .favor-fill {
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        #shen-fill { background: linear-gradient(90deg, #93c5fd, #60a5fa); }
        #lu-fill { background: linear-gradient(90deg, #fdba74, #fb923c); }
        #su-fill { background: linear-gradient(90deg, #f9a8d4, #f472b6); }

        .heart-icon {
            color: #f43f5e;
            font-size: 16px;
        }

        /* 场景区域 */
        #scene-area {
            height: 380px;
            position: relative;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        #scene-name {
            position: absolute;
            top: 15px;
            left: 20px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            color: #9d174d;
            font-size: 14px;
            border: 1px solid #fbcfe8;
            z-index: 10;
        }

        /* 角色立绘 */
        .character {
            position: absolute;
            bottom: 0;
            width: 140px;
            height: 280px;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }

        .character:hover { transform: translateY(-5px); }

        .character-name {
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 14px;
            color: #831843;
            margin-top: 10px;
        }

        .character-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #char-shen { left: 80px; }
        #char-lu { left: 380px; }
        #char-su { right: 80px; }

        .hidden { display: none !important; }

        /* 对话框 */
        #dialog-box {
            height: 160px;
            margin: 20px;
            padding: 20px 25px;
            background: white;
            border: 2px solid #f9a8d4;
            border-radius: 16px;
            position: relative;
            cursor: pointer;
        }

        #speaker-name {
            position: absolute;
            top: -15px;
            left: 20px;
            padding: 4px 16px;
            background: #f472b6;
            color: white;
            border-radius: 15px;
            font-size: 14px;
        }

        #dialog-text {
            font-size: 17px;
            line-height: 1.8;
            color: #4a044e;
            margin-top: 10px;
            white-space: pre-wrap;
        }

        #tip {
            position: absolute;
            bottom: 10px;
            right: 30px;
            font-size: 12px;
            color: #f472b6;
        }

        /* 选项区域 */
        #choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 20px 20px;
        }

        .choice-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #fce7f3, #fbcfe8);
            border: 2px solid #f472b6;
            border-radius: 12px;
            color: #9d174d;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, #fbcfe8, #f9a8d4);
            transform: translateX(5px);
        }

        /* 互动气泡 */
        #interaction-bubble {
            position: absolute;
            padding: 8px 14px;
            background: white;
            border: 2px solid #f472b6;
            border-radius: 15px;
            font-size: 13px;
            color: #831843;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        /* 全局手绘主题：纸张、墨线与淡彩 */
        :root {
            --paper: #fffdf5;
            --ink: #51483e;
            --pencil: #827665;
            --rose: #d88b8b;
            --line: #c4b8a2;
        }
        * { font-family: "KaiTi", "STKaiti", "楷体", "Microsoft YaHei", serif; }
        body {
            color: var(--ink);
            background-color: #eae4d6;
            background-image: radial-gradient(#b2a78c33 .7px, transparent .8px),
                repeating-linear-gradient(0deg, transparent 0 31px, #a79d8820 31px 32px);
            background-size: 6px 6px, auto;
            padding: 36px 20px;
        }
        #game-container {
            width: min(960px, 100%);
            background: var(--paper);
            border: 2px solid var(--pencil);
            border-radius: 7px 12px 9px 5px / 10px 6px 12px 8px;
            box-shadow: 5px 6px 0 #d7cdbb, 6px 7px 0 1px #a99c85, 12px 18px 35px #66584018;
        }
        #start-screen {
            min-height: 680px;
            position: relative;
            height: auto;
            padding: 48px 32px;
            background-color: var(--paper);
            background-image: radial-gradient(#aa9e811c .7px, transparent .8px),
                repeating-linear-gradient(0deg, transparent 0 31px, #a9bdc52b 31px 32px);
            background-size: 5px 5px, auto;
        }
        #start-screen::before {
            content: "四班 · 青春观察手记";
            font-size: 15px;
            letter-spacing: 4px;
            color: #8e806d;
            border-bottom: 1px dashed #b6a68b;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        #start-screen::after {
            content: "把心事写在这一页，把故事留给明天。";
            color: #9b8e7a;
            font-size: 14px;
            margin-top: 32px;
            letter-spacing: 2px;
        }
        #start-screen h1 {
            max-width: 740px;
            text-align: center;
            font-size: clamp(28px, 4.3vw, 46px);
            font-weight: 600;
            line-height: 1.5;
            letter-spacing: 3px;
            color: var(--ink);
            text-shadow: none;
            transform: rotate(-1deg);
            margin-bottom: 12px;
            background: linear-gradient(transparent 70%, #f1d8a9a6 70% 91%, transparent 91%);
        }
        #start-screen p {
            font-size: 17px;
            color: #9a7168;
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.8;
        }
        .cover-sketch { width: min(390px, 90%); height: 160px; margin: 5px 0 23px; color: #837764; }
        #start-btn, #romance-btn, .choice-btn {
            border: 2px solid var(--pencil);
            border-radius: 5px 9px 6px 10px / 8px 5px 10px 6px;
            color: var(--ink);
            box-shadow: 3px 4px 0 #b6a88e;
            transition: transform .18s, box-shadow .18s, background-color .18s;
        }
        #start-btn { background: #efd2c7; font-size: 23px; padding: 13px 62px; transform: rotate(-1deg); }
        #romance-btn { background: #f6f0df; margin-top: 19px; padding: 11px 22px; line-height: 1.5; }
        #su-romance-btn { margin-top: 18px; padding: 10px 22px; text-align: center; max-width: 100%; }
        #xu-romance-btn { margin-top: 18px; padding: 10px 22px; text-align: center; max-width: 100%; background: #e8eddc; }
        .story-note { margin: 20px 0 0 !important; font-size: 12px !important; color: #8e806d !important; }
        #xu-fill { background: repeating-linear-gradient(110deg, #9eaf87 0 3px, #cad4b7 3px 5px); }
        #char-xu { left: 36.5%; }
        .four-characters .character { width: 22%; }
        .four-characters #char-shen { left: 2%; }
        .four-characters #char-lu { left: 27%; }
        .four-characters #char-su { left: 52%; right: auto; }
        .four-characters #char-xu { left: 77%; }
        #scene-area.xu-portrait { height: 480px; }
        .xu-portrait #char-xu { height: auto; padding-bottom: 12px; background: transparent !important; }
        .xu-portrait .character-avatar { display: none; }
        #moments-panel { margin: 0 24px 24px; padding: 18px; border: 1px dashed #a9987d; border-radius: 5px 9px 4px 8px; background: #f7f2e5; }
        #moments-panel h2 { font-size: 19px; font-weight: 500; margin-bottom: 6px; }
        .moments-note { font-size: 12px; color: #8e806d; margin-bottom: 14px; }
        .moments-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
        .moment-card { padding: 10px; background: #fffdf5; border: 1px solid #b8aa94; border-radius: 3px 6px 4px 7px; box-shadow: 2px 3px 0 #b6a88e35; }
        .moment-card img { display: block; width: 100%; height: 165px; object-fit: cover; object-position: center 32%; border: 1px solid #c7bba5; }
        .moment-card p { margin-top: 10px; font-size: 15px; line-height: 1.7; }
        .moment-card small { display: block; margin-top: 8px; color: #8b7864; }
        @media (max-width: 600px) {
            #favor-bar .favor-item { flex-basis: 43%; }
            .four-characters .character-avatar { width: 47px; height: 54px; font-size: 24px; }
            #scene-area.xu-portrait { height: 390px; }
            #moments-panel { margin: 0 14px 20px; padding: 12px; }
            .moments-grid { grid-template-columns: 1fr; }
            .moment-card img { height: 220px; object-fit: contain; background: #eee6d6; }
        }
        #start-btn:hover, #romance-btn:hover, .choice-btn:hover {
            background: #f0dfb8;
            transform: translate(-1px, -2px) rotate(-.5deg);
            box-shadow: 5px 6px 0 #b6a88e;
        }
        button:active { translate: 2px 3px; }
        button:focus-visible, a:focus-visible, .character:focus-visible, #dialog-box:focus-visible {
            outline: 3px dashed #967556; outline-offset: 5px;
        }
        #favor-bar {
            height: auto;
            min-height: 70px;
            gap: 16px;
            padding: 18px 24px;
            background: #f7f1e3;
            border-bottom: 1px dashed #b3a58d;
        }
        .favor-item { gap: 8px; }
        .favor-name { width: auto; min-width: 48px; color: var(--ink); font-size: 15px; }
        .favor-track { width: clamp(50px, 12vw, 120px); height: 11px; background: #e8dfce; border: 1px solid #978872; border-radius: 4px 7px 5px 3px; transform: rotate(-1deg); }
        .favor-fill { border-radius: 2px; background-size: 6px 6px !important; }
        #shen-fill { background: repeating-linear-gradient(110deg, #9cb9c2 0 3px, #bed0d3 3px 5px); }
        #lu-fill { background: repeating-linear-gradient(110deg, #d5b578 0 3px, #e4cea2 3px 5px); }
        #su-fill { background: repeating-linear-gradient(110deg, #cf9696 0 3px, #e1b7ad 3px 5px); }
        .heart-icon { color: #bd827b; }
        #scene-area {
            margin: 20px 24px 28px;
            border: 8px solid #fffdf7;
            outline: 1px solid #baaf9c;
            border-radius: 2px 5px 3px 6px;
            box-shadow: 3px 5px 0 #b6a88e35;
            isolation: isolate;
        }
        #scene-area::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            border: 1px solid #8e81674d;
            background: radial-gradient(#7d6c4417 .65px, transparent .9px);
            background-size: 4px 4px;
        }
        #scene-area.video-scene { background: #423d35 !important; }
        #scene-area.art-room-portrait {
            height: auto;
            aspect-ratio: 3 / 2;
            min-height: 0;
        }
        .art-room-portrait #char-su { height: auto; padding-bottom: 12px; background: transparent !important; }
        .art-room-portrait #char-su .character-avatar { display: none; }
        #scene-name {
            top: 14px; left: 14px;
            border: 1px solid #b5a68c;
            background: #fff8e5ed;
            border-radius: 2px 5px 3px 4px;
            color: #665743;
            transform: rotate(-2deg);
            box-shadow: 2px 2px 0 #574d3920;
        }
        #scene-name::before { content: "✎ "; }
        .character { width: 27%; max-width: 160px; height: 240px; border-radius: 48% 44% 9px 8px; z-index: 2; }
        #char-shen { left: 5%; }
        #char-lu { left: 36.5%; }
        #char-su { right: 5%; }
        .character-avatar {
            width: 92px; height: 96px;
            border: 2px solid #8c7e69;
            outline: 1px dashed #b2a087;
            outline-offset: 4px;
            border-radius: 47% 53% 45% 55% / 54% 45% 55% 46%;
            background: #fff9eb;
            box-shadow: 3px 4px 0 #8f7b6126;
            transform: rotate(-4deg);
        }
        #char-lu .character-avatar { transform: rotate(4deg); }
        .character-name { text-align: center; padding: 5px 8px; border: 1px solid #b6a58e; border-radius: 3px 5px 2px 4px; background: #fff9e9f0; color: #62523f; line-height: 1.5; transform: rotate(-2deg); }
        #dialog-box {
            height: auto; min-height: 166px;
            margin: 24px; padding: 25px 25px 35px;
            border: 2px solid #a89880;
            border-radius: 7px 4px 9px 5px / 5px 8px 4px 7px;
            background: repeating-linear-gradient(transparent 0 30px, #bbcad330 30px 31px), #fffdf5;
            box-shadow: 3px 4px 0 #c0b39c3d;
        }
        #speaker-name {
            top: -16px; left: 20px;
            border: 1px solid #9b8b74;
            border-radius: 3px 5px 2px 4px;
            color: #493f32;
            padding: 5px 18px;
            transform: rotate(-2deg);
            background: #edc5b9;
        }
        #dialog-text { color: var(--ink); font-size: 18px; line-height: 1.85; margin-top: 0; }
        #tip { color: #9c8b70; right: 20px; bottom: 9px; }
        #choices-container { padding: 0 24px 28px; gap: 13px; }
        .choice-btn { background: #f6edda; padding: 13px 18px; font-size: 17px; line-height: 1.6; }
        .choice-btn::before { content: "↳ "; color: #a08662; }
        .choice-btn:nth-child(2n) { border-radius: 8px 5px 10px 4px / 4px 9px 5px 8px; background-color: #f5e8e0; }
        #interaction-bubble { border: 1px solid #9c8a71; border-radius: 8px 5px 10px 4px; color: #62513f; background: #fff9e5; box-shadow: 2px 3px 0 #8e775630; z-index: 20; max-width: calc(100% - 24px); white-space: normal; }
        #sports-video { border: 1px solid #b8a68d; border-radius: 3px; }
        #sports-video-link { color: #ead8b5; text-underline-offset: 4px; }
        @media (max-width: 600px) {
            body { padding: 14px 10px; align-items: flex-start; }
            #game-container { min-height: 700px; }
            #start-screen { min-height: 700px; padding: 36px 20px; }
            #start-screen h1 { font-size: 32px; max-width: 300px; }
            #start-screen::before { font-size: 13px; letter-spacing: 2px; margin-bottom: 24px; }
            #start-screen::after { font-size: 12px; letter-spacing: 0; }
            #romance-btn { font-size: 15px; max-width: 100%; }
            #favor-bar { padding: 14px 12px; gap: 12px; flex-wrap: wrap; }
            .favor-item { flex: 1 1 28%; flex-wrap: wrap; justify-content: center; gap: 5px; }
            .favor-track { width: 45px; }
            .favor-name { font-size: 13px; min-width: 39px; }
            .heart-icon { font-size: 12px; }
            #scene-area { margin: 16px 14px 26px; height: 330px; border-width: 5px; }
            #scene-area.couple-photo { height: 380px; }
            .character { height: 190px; }
            .character-avatar { width: 58px; height: 64px; font-size: 29px; }
            .character-name { font-size: 12px; padding: 4px; }
            #dialog-box { margin: 24px 14px 20px; padding: 24px 16px 36px; }
            #dialog-text { font-size: 17px; }
            #choices-container { padding: 0 14px 24px; }
            .choice-btn { font-size: 16px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 开始界面 -->
        <div id="start-screen">
            <h1>完蛋！我被四班同学包围了</h1>
            <p>🌸 樱华高中 · 高一四班恋爱物语 🌸</p>
            <svg class="cover-sketch" viewBox="0 0 390 160" fill="none" aria-hidden="true">
                <path d="M20 141 Q165 136 372 142" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M94 137 L96 69 196 29 295 68 296 139" fill="#f2e7d0" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M83 72 L194 20 307 72 M91 77 L195 31 300 76" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M178 139 L178 108 Q194 103 210 108 L211 139" fill="#c5d4d2" stroke="currentColor" stroke-width="1.5"/>
                <path d="M112 84 L139 83 140 102 112 103 Z M249 83 L276 84 275 103 249 102 Z M112 115 L139 114 140 132 112 132 Z M249 114 L276 115 275 132 249 132 Z" fill="#d1dddb" stroke="currentColor" stroke-width="1.4"/>
                <path d="M125 84 L126 102 M262 84 L262 102 M125 115 L126 132 M262 115 L262 132" stroke="currentColor"/>
                <circle cx="195" cy="69" r="15" fill="#fff9e8" stroke="currentColor" stroke-width="1.5"/>
                <path d="M195 59 L195 70 204 75 M47 140 Q51 112 45 86 M44 115 L31 104 M47 105 L62 93 M338 139 L341 83 M340 112 L354 99" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M22 85 Q16 66 37 65 Q37 47 54 56 Q72 46 76 65 Q94 76 76 88 Q66 104 51 92 Q31 105 22 85 Z M318 78 Q313 59 331 58 Q341 40 353 56 Q375 53 372 72 Q382 88 362 92 Q340 105 331 89 Q316 95 318 78 Z" fill="#e8c8bf" stroke="#b69a87" stroke-width="1.4"/>
                <path d="M31 70 Q49 63 63 73 M329 66 Q343 58 360 70 M55 28 L59 20 M63 33 L73 31 M320 26 Q325 19 330 27 Q334 32 326 39 Q315 33 320 26" stroke="#bf9388" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M164 144 L157 156 M226 144 L233 155" stroke="currentColor" stroke-width="1.2"/>
            </svg>
            <button id="start-btn">开始游戏</button>
            <button id="romance-btn">直接体验 · 张正与曲嘉华的恋爱支线</button>
            <button id="su-romance-btn" class="choice-btn">李逸鸿专属篇 · 画册里的你</button>
            <button id="xu-romance-btn" class="choice-btn">徐一鸣专属篇 · 朋友圈之外</button>
            <p class="story-note">校园故事纯属虚构，照片仅作角色配图。</p>
        </div>

        <!-- 好感度栏 -->
        <div id="favor-bar" class="hidden">
            <div class="favor-item">
                <span class="favor-name">张 正</span>
                <div class="favor-track"><div id="shen-fill" class="favor-fill"></div></div>
                <span class="heart-icon">♥</span>
            </div>
            <div class="favor-item">
                <span class="favor-name">曲嘉华</span>
                <div class="favor-track"><div id="lu-fill" class="favor-fill"></div></div>

    // =============================================================
    // 【逻辑区 - 不建议修改】
    // =============================================================

    const gameState = {
        favor: { shen: 0, lu: 0, su: 0, xu: 0 },
        currentNode: null
    };

    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const favorBar = document.getElementById('favor-bar');
    const sceneArea = document.getElementById('scene-area');
    const dialogBox = document.getElementById('dialog-box');
    const choicesContainer = document.getElementById('choices-container');
    const sceneName = document.getElementById('scene-name');
    const speakerName = document.getElementById('speaker-name');
    const dialogText = document.getElementById('dialog-text');
    const bubble = document.getElementById('interaction-bubble');
    const sportsVideoContainer = document.getElementById('sports-video-container');
    const sportsVideo = document.getElementById('sports-video');
    const sportsVideoLink = document.getElementById('sports-video-link');

    const charElements = {
        shen: document.getElementById('char-shen'),
        lu: document.getElementById('char-lu'),
        su: document.getElementById('char-su'),
        xu: document.getElementById('char-xu')
    };
    const avatarElements = {
        shen: document.getElementById('avatar-shen'),
        lu: document.getElementById('avatar-lu'),
        su: document.getElementById('avatar-su'),
        xu: document.getElementById('avatar-xu')
    };

    function initCharacters() {
        Object.keys(CHARACTERS).forEach(id => {
            avatarElements[id].textContent = CHARACTERS[id].avatar;
            charElements[id].style.background = `linear-gradient(180deg, transparent 15%, ${CHARACTERS[id].color}66)`;
        });
    }

    function startGame(nodeId) {
        startScreen.classList.add('hidden');
        favorBar.classList.remove('hidden');
        sceneArea.classList.remove('hidden');
        dialogBox.classList.remove('hidden');
        initCharacters();
        renderNode(nodeId);
    }

    startBtn.addEventListener('click', () => startGame('intro1'));
    document.getElementById('romance-btn').addEventListener('click', () => startGame('romance_start'));
    document.getElementById('su-romance-btn').addEventListener('click', () => startGame('su_love_start'));
    document.getElementById('xu-romance-btn').addEventListener('click', () => startGame('xu_start'));

    function renderMoments(posts) {
        const panel = document.getElementById('moments-panel');
        panel.innerHTML = '';
        panel.classList.toggle('hidden', !posts?.length);
        if (!posts?.length) return;
        const heading = document.createElement('h2');
        heading.textContent = '徐一鸣的快乐展览';
        panel.appendChild(heading);
        const note = document.createElement('p');
        note.className = 'moments-note';
        note.textContent = '游戏内虚构动态 · 不连接真实社交账号';
        panel.appendChild(note);
        const grid = document.createElement('div');
        grid.className = 'moments-grid';
        posts.forEach(post => {
            const card = document.createElement('article');
            card.className = 'moment-card';
            const img = document.createElement('img');
            img.src = XU_YI_MING_BG[post.photo];
            img.alt = '徐一鸣的校园生活配图';
            const caption = document.createElement('p');
            caption.textContent = post.caption;
            const time = document.createElement('small');
            time.textContent = post.time;
            card.appendChild(img); card.appendChild(caption); card.appendChild(time);
            grid.appendChild(card);
        });
        panel.appendChild(grid);
    }

    function renderNode(nodeId) {
        const node = story[nodeId];
        if (!node) return;
        
        gameState.currentNode = nodeId;
        renderMoments(node.moments);
        sceneArea.classList.toggle('four-characters', node.chars?.length === 4);
        const isXuPortrait = Boolean(node.xuPhoto && XU_YI_MING_BG[node.xuPhoto] && !node.photo && !node.video);
        sceneArea.classList.toggle('xu-portrait', isXuPortrait);

        sportsVideo.pause();
        sportsVideoContainer.classList.toggle('hidden', !node.video);
        sceneArea.classList.toggle('video-scene', Boolean(node.video));
        if (node.video) {
            sportsVideo.setAttribute('src', node.video);
            sportsVideo.setAttribute('aria-label', node.scene);
            sportsVideoLink.href = node.video;
            sportsVideo.load();
        } else if (sportsVideo.hasAttribute('src')) {
            sportsVideo.removeAttribute('src');
            sportsVideo.load();
            sportsVideoLink.removeAttribute('href');
        }

        sceneArea.classList.toggle('couple-photo', Boolean(node.photo));
        const isArtRoomPortrait = node.scene === '美术室' && node.chars?.length === 1 && node.chars[0] === 'su' && !node.photo && !node.video;
        sceneArea.classList.toggle('art-room-portrait', Boolean(isArtRoomPortrait));
        
        const isZhangZhengScene = node.chars?.length === 1 && node.chars[0] === 'shen';
        if (node.photo && COUPLE_BG[node.photo]) {
            sceneArea.style.background = `url("${COUPLE_BG[node.photo]}") center / contain no-repeat #dbeafe`;
        } else if (isXuPortrait) {
            sceneArea.style.background = `url("${XU_YI_MING_BG[node.xuPhoto]}") center / contain no-repeat #f4e8d2`;
        } else if (isArtRoomPortrait) {
            sceneArea.style.background = `url("${LI_YI_HONG_ART_BG}") center / contain no-repeat #f4e8d2`;
        } else if (isZhangZhengScene) {
            const photo = node.scene === '学校田径场' ? ZHANG_ZHENG_BG.sports : ZHANG_ZHENG_BG.daily;
            sceneArea.style.background = `url("${photo}") center 38% / cover no-repeat`;
        } else if (node.chars?.length === 1 && node.chars[0] === 'lu') {
            const photo = nodeId.startsWith('sports_') ? QU_JIA_HUA_BG.sports : QU_JIA_HUA_BG.daily;
            sceneArea.style.background = `url("${photo}") center 38% / cover no-repeat`;
        } else if (node.chars?.length === 1 && node.chars[0] === 'su') {
            sceneArea.style.background = `url("${LI_YI_HONG_BG}") center 25% / cover no-repeat`;
        } else if (SCENE_BG[node.scene]) {
            sceneArea.style.background = SCENE_BG[node.scene];
        } else {
            sceneArea.style.background = '#f5ecdd';
        }
        sceneName.textContent = node.scene;
        
        Object.values(charElements).forEach(el => el.classList.add('hidden'));
        if (node.chars) {
            node.chars.forEach(id => {
                charElements[id].classList.remove('hidden');
            });
        }
        
        speakerName.textContent = node.speaker || "旁白";
        const speakerCharacter = Object.values(CHARACTERS).find(char => char.name === node.speaker);
        if (speakerCharacter) {
            speakerName.style.background = speakerCharacter.color;
        } else {
            speakerName.style.background = "#edc5b9";
        }
        dialogText.textContent = node.text;
        
        choicesContainer.innerHTML = '';
        choicesContainer.classList.add('hidden');
        
        if (node.choices && node.choices.length > 0) {
            choicesContainer.classList.remove('hidden');
            node.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                btn.addEventListener('click', () => {
                    if (choice.favor) {
                        Object.keys(choice.favor).forEach(char => {
                            gameState.favor[char] = Math.min(100, gameState.favor[char] + choice.favor[char]);
                        });
                        updateFavorBar();
                    }
                    renderNode(choice.next);
                });
                choicesContainer.appendChild(btn);
            });
        }
    }

    function updateFavorBar() {
        Object.keys(CHARACTERS).forEach(id => {
            document.getElementById(`${id}-fill`).style.width = gameState.favor[id] + '%';
        });
    }

    dialogBox.addEventListener('click', (e) => {
        if (e.target.closest('.choice-btn')) return;
        const node = story[gameState.currentNode];
        if (node && node.next && !node.choices) {
            renderNode(node.next);
        }
    });

    function showBubble(charId, element) {
        const char = CHARACTERS[charId];
        const randomLine = char.interactions[Math.floor(Math.random() * char.interactions.length)];
        
        const rect = element.getBoundingClientRect();
        const containerRect = sceneArea.getBoundingClientRect();
        
        bubble.textContent = randomLine;
        bubble.style.left = '0px';
        bubble.style.top = '0px';
        const bubbleLeft = rect.left - containerRect.left - sceneArea.clientLeft + rect.width / 2 - bubble.offsetWidth / 2;
        bubble.style.left = Math.max(4, Math.min(sceneArea.clientWidth - bubble.offsetWidth - 4, bubbleLeft)) + 'px';
        bubble.style.top = Math.max(55, rect.top - containerRect.top - sceneArea.clientTop - bubble.offsetHeight - 10) + 'px';
        bubble.style.opacity = '1';
        
        gameState.favor[charId] = Math.min(100, gameState.favor[charId] + 1);
        updateFavorBar();
        
        setTimeout(() => {
            bubble.style.opacity = '0';
        }, 1500);
    }

    Object.keys(charElements).forEach(id => {
        charElements[id].addEventListener('click', () => showBubble(id, charElements[id]));
    });
